<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The site, at sixteen pixels: its paper, its serif, and the progress trail
       caught mid-scroll. The trail stops where it stops on purpose — a finished
       bar is a page you are done with. -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#f0efe9"/>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="#161917" stroke-opacity="0.15" stroke-width="2"/>
  <path d="M12 11.5 H37" stroke="#0b8d73" stroke-width="4" stroke-linecap="round"/>
  <text x="32" y="47" font-family="Georgia, 'Times New Roman', serif" font-size="33" text-anchor="middle" fill="#161917">XL</text>
</svg>
